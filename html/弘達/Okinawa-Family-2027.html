function valid(data) {

    Array.isArray(data[section]) &&
    data[section].every(row=>row && typeof row.id==="string" && typeof row.title==="string" &&
      Object.values(row).every(value=>typeof value==="string")) &&
    new Set(data[section].map(row=>row.id)).size===data[section].length

}

}

function pill(text,good) { return el("span",text,"badge"+(good?" good":"")); }

}
function card(section,row) {

    if (row.timestamp && !Number.isNaN(Date.parse(row.timestamp))) when=clock.format(new Date(row.timestamp));

  for (const name of schemas[section]) {

  }
  if (links.childNodes.length) box.append(links);

    const days=[...new Set([...tripDays,...rows.map(row=>row.date).filter(Boolean)])].sort();
    for (const value of [...days,""]) {
      const control=button(value?dateLabel(value):"未排日期",()=>{day=value;render();$(".days [aria-pressed=true]")?.focus();});
      control.setAttribute("aria-pressed",value===day);
      tabs.append(control);
    }
    main.append(tabs,el("h3",day?day:"未排日期的行程","day-label"));
    rows=rows.filter(row=>(row.date||"")===day).sort((a,b)=>(a.start||"99:99").localeCompare(b.start||"99:99"));
  }
  if (view==="stay") main.append(el("p","住宿填寫為 5 晚。請用飯店訂單核對實際入住與退房日期。航班時間欄使用各機場當地時間。","hint"));
  if (view==="rides") main.append(el("p","依 JUNGLIA 官網標記 132 cm 的身高資格。當日量測、營運與其他體驗條件請出發前再核對。","hint"));
  if (view==="history") main.append(el("p","新增、編輯、刪除與待辦勾選會自動留下紀錄，也可手動新增確認結果。","hint"));
  if (!rows.length) { main.append(el("p","目前沒有紀錄。","empty")); return; }
  const list=el("div",undefined,view==="plan"?"timeline":"grid");
  rows.forEach(row=>list.append(card(view,row)));
  main.append(list);
}
function openEditor(section,row) {
  editId=row?.id||null;
  $("#editor-title").textContent=(row?"編輯":"新增")+singular[section];
  const container=$("#fields");
  container.replaceChildren();
  for (const name of schemas[section]) {
    const [label,type]=fields[name];
    const wrapper=el("label",label,type==="textarea"||name==="title"?"wide":"");
    const control=el(type==="textarea"||type==="select"?type:"input");
    control.name=name;
    if (control.tagName==="INPUT") control.type=type;
    if (type==="select") {
      const options=name==="eligible"?["待確認","符合身高門檻","未達身高門檻"]:section==="tasks"?taskStatus:section==="history"?["已記錄","待確認","已確認"]:status;
      for (const option of options) control.append(el("option",option));
    }
    const fallback=name==="date"&&section==="plan"?day:"";
    if (row?.[name] || fallback && !row) control.value=row?.[name]||fallback;
    if (name==="title") control.required=true;
    if (["text","url","textarea"].includes(type)) control.placeholder=pending;
    wrapper.append(control);
    container.append(wrapper);
  }
  $("#form").dataset.section=section;
  $("#remove").hidden=!row;
  dialog.showModal();
  $("#form").elements.title.focus();
}
$("#close").onclick=()=>dialog.close();
$("#form").onsubmit=event=>{
  event.preventDefault();
  const form=event.currentTarget;
  const section=form.dataset.section;
  const next=structuredClone(data);
  const changes=Object.fromEntries([...new FormData(form)].map(([key,value])=>[key,value.trim()]));
  if (!changes.title) { form.elements.title.focus(); return; }
  if (section==="plan" && changes.start && changes.end && changes.end<changes.start) { alert("結束時間須晚於開始時間。跨日行程可拆成兩筆。"); return; }
  if (changes.date && changes.lastDate && changes.lastDate<changes.date) { alert("結束日期須等於或晚於開始日期。"); return; }
  const original=next[section].find(row=>row.id===editId);
  const row={...original,...changes,id:editId||crypto.randomUUID()};
  if (original) Object.assign(original,row);
  else next[section].unshift(row);
  if (section!=="history") {
    const diff=schemas[section].filter(name=>(data[section].find(item=>item.id===editId)?.[name]||"")!==row[name]);
    const previous=data[section].find(item=>item.id===editId);
    if (!previous || diff.length) log(next,(previous?"編輯":"新增")+singular[section]+"｜"+row.title,
      diff.map(name=>fields[name][0]+"："+(previous?(previous[name]||pending)+" → ":"")+(row[name]||pending)).join("\n"));
  }
  const oldDay=day;
  if (section==="plan") day=row.date;
  if (commit(next)) dialog.close(); else day=oldDay;
};
$("#remove").onclick=()=>{
  const section=$("#form").dataset.section;
  const next=structuredClone(data);
  const row=next[section].find(item=>item.id===editId);
  if (!row || !confirm("刪除「"+row.title+"」？")) return;
  next[section]=next[section].filter(item=>item.id!==editId);
  if (section!=="history") log(next,"刪除"+singular[section]+"｜"+row.title,row.date?dateLabel(row.date):"");
  if (commit(next)) dialog.close();
};
$("#export").onclick=()=>{
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  const a=el("a");
  a.href=url;
  a.download="okinawa-family-2027.json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};
$("#import").onclick=()=>$("#file").click();
$("#file").onchange=async event=>{
  const input=event.currentTarget;
  try {
    const file=input.files[0];
    if (!file) return;
    const next=JSON.parse(await file.text());
    if (!valid(next)) throw new Error("invalid backup");
    if (!confirm("匯入備份會取代此瀏覽器目前的行程與歷程。確定匯入？")) return;
    log(next,"匯入旅行備份",file.name);
    commit(next);
  } catch { alert("無法讀取此備份。請選擇本站匯出的 JSON 檔。"); }
  finally { input.value=""; }
};
render();
</script></body></html>
